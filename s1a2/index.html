<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>My GitHub Pages Homepage</title>
        <link rel="stylesheet" href="style.css" />
        <section id ="still-life" class="stage" aria-hidden="true"> 

        <div class="cloth"></div> 

        <!-- WATCH --> 
        <div class="item watch"> 
            <div class="strap"></div> 
            <div class="holes"></div> 
            <div class="holes1"></div> 
            <div class="holes2"></div> 
            <div class="button"></div> 
            <div class="face"></div> 
            <div class="buckle"></div> 
        </div> 

        <!-- CASIO TV --> 
        <div class="item tv"> 
            <div class="casiotext">CASIO</div> 
            <div class="screen"></div> 
            <div class="badge"></div> 
            <div class="btn"></div> 
        </div> 

        <!-- PLAYING CARD --> 
        <div class="item card"> 
            <div class="paper"></div> 
            <div class="a">A</div> 
            <div class="heart">♥️</div>
            <div class="heart big">♥️</div> 

        </div> 

        <!-- FLOPPY DISKS STACK --> 
        <div class="item floppy"> 
            <div class="disk"></div> 
            <div class="label"></div> 
            <div class="floppywords">Macintosh™</div> 
            <div class="floppywords2">HyperCard™ and Stacks</div> 
            <div class="metal"></div> 
        </div> 

        <!-- CD + CASE WITH STICKER --> 
        <div class="item cdcase"> 
            <div class="case"></div> 
            <div class="cd"> 
            <div class="hub"></div> 
            </div> 
            <div class="sticker"> 
            <div class="dot"></div> 
            </div> 
        </div> 

        <!-- XEROX --> 
        <div class="item xerox"> 
            <div class="ticket"></div> 
            <div class="ticket outline"></div> 
            <div class="xeroxword">XEROX</div> 
        </div> 

        </section> 
    </head>
</html>
